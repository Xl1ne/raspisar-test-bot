name: raspisar

services:
  bot:
    build: .
    command: python -m app.bot
    env_file: .env
    volumes:
      - .:/app
    restart: unless-stopped

  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped
